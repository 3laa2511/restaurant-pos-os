name: Bootstrap pnpm lockfile (temporary)

on:
  push:
    branches: ['fix/review-phase-0']
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "services/**/package.json"
  pull_request:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-phase-0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without installing package scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "F-00a: generate pnpm lockfile"
          git push origin HEAD:fix/review-phase-0
