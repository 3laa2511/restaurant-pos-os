name: POS Desktop Quality Gate

on:
  push:
    branches: [main, 'feat/**', 'test/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pos-desktop-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_pos
      RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_pos
      RLS_APP_DATABASE_URL: postgresql://pos_app:pos_app_test_password@localhost:5432/restaurant_pos
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Provision least-privilege RLS test role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pos_app LOGIN PASSWORD 'pos_app_test_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          SQL

      - name: Apply migrations to disposable PostgreSQL
        run: pnpm --dir services/api exec prisma migrate deploy --schema ../../prisma/schema.prisma

      - name: Grant minimum permissions for RLS integration test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public, app TO pos_app;
          GRANT SELECT, INSERT, UPDATE ON TABLE "Branch" TO pos_app;
          SQL

      - name: Lint API
        run: pnpm --dir services/api lint

      - name: Typecheck API
        run: pnpm --dir services/api typecheck

      - name: Test API (including real PostgreSQL RLS isolation)
        run: pnpm --dir services/api test --runInBand

      - name: Lint desktop
        run: pnpm --dir apps/pos-desktop lint

      - name: Typecheck desktop
        run: pnpm --dir apps/pos-desktop typecheck

      - name: Test desktop sync queue
        run: pnpm --dir apps/pos-desktop test

      - name: Build desktop frontend
        run: pnpm --dir apps/pos-desktop build

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pos-desktop/src-tauri -> target

      - name: Check Tauri native layer
        working-directory: apps/pos-desktop/src-tauri
        run: cargo check
