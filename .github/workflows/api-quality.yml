name: API Quality Gate

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @restaurant-pos/api generate
      - run: pnpm --filter @restaurant-pos/api typecheck
      - run: pnpm --filter @restaurant-pos/api test -- --runInBand
