name: API Quality Gate

permissions:
  contents: write

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_pos_test
      RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_pos_test
      RLS_APP_DATABASE_URL: postgresql://rls_app:rls_app@localhost:5432/restaurant_pos_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start PostgreSQL
        run: |
          docker run -d --name restaurant-pos-postgres             -e POSTGRES_USER=postgres             -e POSTGRES_PASSWORD=postgres             -e POSTGRES_DB=restaurant_pos_test             -p 5432:5432 postgres:17
          for i in {1..30}; do
            docker exec restaurant-pos-postgres pg_isready -U postgres -d restaurant_pos_test && break
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare RLS test role
        run: |
          psql "$RLS_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rls_app LOGIN PASSWORD 'rls_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE restaurant_pos_test TO rls_app;
          SQL

      - name: Generate historical baseline SQL
        run: pnpm exec prisma migrate diff --from-empty --to-schema=../../prisma/schema.initial.prisma --script > /tmp/initial.sql && cat /tmp/initial.sql
        working-directory: services/api

      - name: Validate reconstructed baseline migration
        run: |
          cp /tmp/initial.sql prisma/migrations/0001_initial/migration.sql
          test -s prisma/migrations/0001_initial/migration.sql

      - name: Upload reconstructed baseline SQL
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-initial-migration
          path: prisma/migrations/0001_initial/migration.sql
          if-no-files-found: error

      - name: Persist reconstructed baseline migration
        if: github.event_name == 'push'
        working-directory: services/api
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0001_initial/migration.sql
          git diff --cached --quiet || git commit -m "chore: persist reconstructed initial migration"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Apply migrations
        working-directory: services/api
        run: pnpm exec prisma migrate deploy --schema ../../prisma/schema.prisma

      - name: Grant RLS test role
        run: |
          psql "$RLS_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public, app TO rls_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rls_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO rls_app;
          SQL

      - name: Generate Prisma client
        run: pnpm --filter @restaurant-pos/api generate

      - name: Typecheck
        run: pnpm --filter @restaurant-pos/api typecheck

      - name: Unit and integration tests
        run: pnpm --filter @restaurant-pos/api test --runInBand
