[package]
name = "restaurant-pos-pos"
version = "0.1.0"
description = "Restaurant POS desktop native layer"
authors = ["AZZAZI"]
edition = "2021"

[lib]
name = "restaurant_pos_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
